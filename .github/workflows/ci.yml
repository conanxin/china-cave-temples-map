name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Node tests
        run: npm run test:node
      - name: UI tests
        run: npm run test:ui
      - name: Build
        run: npm run build
      - name: Install Python test dependencies
        run: python -m pip install PyMuPDF Pillow pypdf
      - name: Python tests
        run: |
          PYTHONPATH=scripts python -m unittest scripts/test_unesco_pdf_pipeline.py
          PYTHONPATH=scripts python -m unittest scripts/test_apply_reviewed_extent_patch.py
